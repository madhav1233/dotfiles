# ── Reload ────────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ── Basics ────────────────────────────────────────────────────────────────
set -g prefix C-s
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set-option -g status-position top

# True color. tmux only emits 24-bit color if told the outer terminal
# supports it -- without this, catppuccin's hex colors get quantized.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# ── Pane navigation (prefix + h/j/k/l) ────────────────────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits ────────────────────────────────────────────────────────────────
# Default splits inherit the current pane's directory.
unbind '"'
unbind %
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Hold Alt to split from the directory the session was created in instead.
bind M-'"' split-window -v -c "#{session_path}"
bind M-% split-window -h -c "#{session_path}"

# vi keys in copy mode
setw -g mode-keys vi

# ── Plugins ───────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin options must be set BEFORE the plugin loads.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ── Status line ───────────────────────────────────────────────────────────
# catppuccin v2 does NOT build the status line for you: you assemble it from
# modules yourself, and this must come AFTER the plugin has loaded.
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_session}"

# The ":" prompt paints over status line 0, hiding the window list. Grow the
# status to a second line just while the prompt is open. command-prompt blocks
# the command queue, so the commands after it run once the prompt closes --
# on submit and on cancel alike.
set -g status-format[1] ""
bind : {
    set -g status 2
    set -g message-line 1
    command-prompt
    set -g status on
    set -g message-line 0
}
